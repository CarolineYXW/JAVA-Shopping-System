<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .item-card {
            margin-bottom: 20px;
        }
        .item-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Shopping System</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadItems()">All Items</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadItemsByCategory('Electronics')">Electronics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadItemsByCategory('Clothing')">Clothing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadItemsByCategory('Books')">Books</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <button class="btn btn-outline-light me-2" onclick="showLoginForm()">Login</button>
                    <button class="btn btn-outline-light" onclick="showCart()">Cart</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="items-container" class="row"></div>
    </div>

    <script>
        function loadItems() {
            fetch('/api/items')
                .then(response => response.json())
                .then(items => displayItems(items));
        }

        function loadItemsByCategory(category) {
            fetch(`/api/items/category/${category}`)
                .then(response => response.json())
                .then(items => displayItems(items));
        }

        function displayItems(items) {
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            
            items.forEach(item => {
                const card = `
                    <div class="col-md-4">
                        <div class="card item-card">
                            <img src="${item.imagePath}" class="card-img-top item-image" alt="${item.name}">
                            <div class="card-body">
                                <h5 class="card-title">${item.name}</h5>
                                <p class="card-text">$${item.price.toFixed(2)}</p>
                                <p class="card-text">Stock: ${item.stock}</p>
                                <button class="btn btn-primary" onclick="addToCart(${item.id})">Add to Cart</button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function showLoginForm() {
            // TODO: Implement login form
            alert('Login functionality coming soon!');
        }

        function showCart() {
            // TODO: Implement cart view
            alert('Cart functionality coming soon!');
        }

        function addToCart(itemId) {
            // TODO: Implement add to cart
            alert('Add to cart functionality coming soon!');
        }

        // Load all items when the page loads
        loadItems();
    </script>
</body>
</html>
