<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shopping System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card {
            margin-bottom: 20px;
            transition: transform 0.2s;
            height: 100%;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .product-image {
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }
        .category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1;
        }
        .search-container {
            margin-bottom: 20px;
        }
        .category-filter {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Shopping System</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/cart">Cart</a>
                <a class="nav-link" href="/order-history">Order History</a>
                <div id="userSection">
                    <span id="usernameDisplay" class="nav-link text-light" style="display: none;"></span>
                    <a class="nav-link" href="/login" id="loginLink">Login</a>
                    <a class="nav-link" href="/register" id="registerLink">Register</a>
                    <a class="nav-link" href="#" id="logoutLink" style="display: none;" onclick="logout()">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="text-center mb-4">Welcome to Our Shop</h1>
        
        <!-- Search and Filter Section -->
        <div class="row">
            <div class="col-md-6">
                <div class="search-container">
                    <input type="text" class="form-control" id="searchInput" placeholder="Search products...">
                </div>
            </div>
            <div class="col-md-6">
                <div class="category-filter">
                    <select class="form-select" id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Toys">Toys</option>
                        <option value="Art">Art</option>
                        <option value="Home">Home</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="row" id="productsGrid">
            <div class="col-md-4 col-lg-3" th:each="item : ${items}">
                <div class="card product-card">
                    <span class="badge bg-primary category-badge" th:text="${item.category}">Category</span>
                    <img th:src="${item.imagePath != null ? item.imagePath : '/images/placeholder.svg'}" 
                         class="card-img-top product-image" 
                         th:alt="${item.name}"
                         onerror="this.src='/images/placeholder.svg'">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${item.name}">Product Name</h5>
                        <p class="card-text text-primary fw-bold" th:text="${'$' + #numbers.formatDecimal(item.price, 1, 2)}">Price</p>
                        <p class="card-text text-muted" th:text="${'In Stock: ' + item.stock}">Stock</p>
                        <button class="btn btn-primary w-100" 
                                th:onclick="'addToCart(' + ${item.id} + ')'"
                                th:disabled="${item.stock <= 0}">
                            <span th:text="${item.stock > 0 ? 'Add to Cart' : 'Out of Stock'}">Add to Cart</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check login status when page loads
        window.onload = function() {
            checkLoginStatus();
            setupSearchAndFilter();
        };

        function checkLoginStatus() {
            const userId = localStorage.getItem('userId');
            const username = localStorage.getItem('username');
            
            if (userId && username) {
                document.getElementById('usernameDisplay').textContent = `Welcome, ${username}`;
                document.getElementById('usernameDisplay').style.display = 'inline';
                document.getElementById('loginLink').style.display = 'none';
                document.getElementById('registerLink').style.display = 'none';
                document.getElementById('logoutLink').style.display = 'inline';
            } else {
                document.getElementById('usernameDisplay').style.display = 'none';
                document.getElementById('loginLink').style.display = 'inline';
                document.getElementById('registerLink').style.display = 'inline';
                document.getElementById('logoutLink').style.display = 'none';
            }
        }

        function setupSearchAndFilter() {
            const searchInput = document.getElementById('searchInput');
            const categoryFilter = document.getElementById('categoryFilter');
            const productCards = document.querySelectorAll('.product-card');

            function filterProducts() {
                const searchTerm = searchInput.value.toLowerCase();
                const selectedCategory = categoryFilter.value;

                productCards.forEach(card => {
                    const productName = card.querySelector('.card-title').textContent.toLowerCase();
                    const productCategory = card.querySelector('.category-badge').textContent;
                    const matchesSearch = productName.includes(searchTerm);
                    const matchesCategory = !selectedCategory || productCategory === selectedCategory;

                    card.closest('.col-md-4').style.display = matchesSearch && matchesCategory ? 'block' : 'none';
                });
            }

            searchInput.addEventListener('input', filterProducts);
            categoryFilter.addEventListener('change', filterProducts);
        }

        function logout() {
            localStorage.removeItem('userId');
            localStorage.removeItem('username');
            window.location.href = '/';
        }

        function addToCart(itemId) {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                alert('Please login first');
                window.location.href = '/login';
                return;
            }

            fetch('/api/cart/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    userId: parseInt(userId),
                    itemId: itemId,
                    quantity: 1
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success === false) {
                    alert(data.message || 'Error adding item to cart');
                } else {
                    alert('Item added to cart!');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error adding item to cart');
            });
        }
    </script>
</body>
</html>
