<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shopping Cart - Shopping System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Shopping System</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/cart">Cart</a>
                <a class="nav-link" href="/order-history">Order History</a>
                <div id="userSection">
                    <span id="usernameDisplay" class="nav-link text-light" style="display: none;"></span>
                    <a class="nav-link" href="/login" id="loginLink">Login</a>
                    <a class="nav-link" href="/register" id="registerLink">Register</a>
                    <a class="nav-link" href="#" id="logoutLink" style="display: none;" onclick="logout()">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Shopping Cart</h1>
        <div id="cartItems" class="mt-4">
            <!-- Cart items will be loaded here -->
        </div>
        <div class="row mt-4">
            <div class="col-md-6">
                <h3>Total: $<span id="totalAmount">0.00</span></h3>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-primary" onclick="checkout()" id="checkoutButton">Checkout</button>
                <button class="btn btn-secondary" onclick="window.location.href='/'">Continue Shopping</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check login status when page loads
        window.onload = function() {
            checkLoginStatus();
            loadCart();
        };

        function checkLoginStatus() {
            const userId = localStorage.getItem('userId');
            const username = localStorage.getItem('username');
            
            if (userId && username) {
                document.getElementById('usernameDisplay').textContent = `Welcome, ${username}`;
                document.getElementById('usernameDisplay').style.display = 'inline';
                document.getElementById('loginLink').style.display = 'none';
                document.getElementById('registerLink').style.display = 'none';
                document.getElementById('logoutLink').style.display = 'inline';
            } else {
                document.getElementById('usernameDisplay').style.display = 'none';
                document.getElementById('loginLink').style.display = 'inline';
                document.getElementById('registerLink').style.display = 'inline';
                document.getElementById('logoutLink').style.display = 'none';
                window.location.href = '/login';
            }
        }

        function logout() {
            localStorage.removeItem('userId');
            localStorage.removeItem('username');
            window.location.href = '/';
        }

        function loadCart() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = '/login';
                return;
            }

            fetch(`/api/cart/${userId}`)
            .then(response => response.json())
            .then(response => {
                if (!response.success) {
                    throw new Error(response.message || 'Error loading cart');
                }
                const cart = response.cart;
                const cartItems = document.getElementById('cartItems');
                cartItems.innerHTML = '';
                let total = 0;

                if (!cart.items || cart.items.length === 0) {
                    cartItems.innerHTML = '<p class="text-center">Your cart is empty</p>';
                    document.getElementById('totalAmount').textContent = '0.00';
                    document.getElementById('checkoutButton').disabled = true;
                    return;
                }

                document.getElementById('checkoutButton').disabled = false;
                cart.items.forEach(cartItem => {
                    const itemTotal = cartItem.price * cartItem.quantity;
                    total += itemTotal;

                    cartItems.innerHTML += `
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <h5 class="card-title">${cartItem.item.name}</h5>
                                        <p class="card-text">$${cartItem.price.toFixed(2)}</p>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="input-group">
                                            <button class="btn btn-outline-secondary" onclick="updateQuantity(${cartItem.item.id}, ${cartItem.quantity - 1})">-</button>
                                            <input type="number" class="form-control text-center" value="${cartItem.quantity}" readonly>
                                            <button class="btn btn-outline-secondary" onclick="updateQuantity(${cartItem.item.id}, ${cartItem.quantity + 1})">+</button>
                                        </div>
                                    </div>
                                    <div class="col-md-3 text-end">
                                        <p class="card-text">$${itemTotal.toFixed(2)}</p>
                                        <button class="btn btn-danger" onclick="removeItem(${cartItem.item.id})">Remove</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('totalAmount').textContent = total.toFixed(2);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error loading cart: ' + error.message);
            });
        }

        function updateQuantity(itemId, newQuantity) {
            if (newQuantity < 1) return;

            const userId = localStorage.getItem('userId');
            fetch('/api/cart/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    userId: parseInt(userId),
                    itemId: itemId,
                    quantity: newQuantity 
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success === false) {
                    alert(data.message || 'Error updating quantity');
                } else {
                    loadCart();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error updating quantity');
            });
        }

        function removeItem(itemId) {
            const userId = localStorage.getItem('userId');
            fetch(`/api/cart/remove/${userId}/${itemId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success === false) {
                    alert(data.message || 'Error removing item');
                } else {
                    loadCart();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error removing item');
            });
        }

        function checkout() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = '/login';
                return;
            }

            if (!confirm('Are you sure you want to proceed with checkout?')) {
                return;
            }

            fetch(`/api/orders/create/${userId}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    window.location.href = '/order-history';
                } else {
                    alert(data.message || 'Error during checkout');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error during checkout');
            });
        }
    </script>
</body>
</html>
